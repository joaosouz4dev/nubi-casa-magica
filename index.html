<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd59e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <title>Casa do Nubi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #efe3ff;
      font-family: "Comic Sans MS", system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    #game { display: block; width: calc(100 * var(--vw)); height: calc(100 * var(--vh)); }

    /* Botões "de brinquedo": volume, contorno macio, resposta ao toque */
    .toy {
      border: none; border-radius: 50%; cursor: pointer; padding: 0;
      display: grid; place-items: center;
      background: linear-gradient(180deg, #ffffff 0%, #f1e9ff 100%);
      box-shadow: 0 4px 0 #cdb8f0, 0 6px 14px rgba(70,40,110,.18);
      transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, background .25s;
    }
    .toy:active { transform: translateY(3px) scale(.92); box-shadow: 0 1px 0 #cdb8f0, 0 2px 6px rgba(70,40,110,.18); }
    .toy svg { width: 62%; height: 62%; overflow: visible; }

    /* Barra de cômodos */
    #nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      right: calc(env(safe-area-inset-right, 0px) + 10px); z-index: 6;
      display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.55);
      padding: 10px 8px; border-radius: 999px; backdrop-filter: blur(6px);
      box-shadow: 0 6px 20px rgba(70,40,110,.15);
      pointer-events: none;   /* só os botões recebem toque; o fundo não bloqueia o jogo */
    }
    #nav button { width: min(calc(13 * var(--vw)), 54px, calc(11 * var(--vh))); height: min(calc(13 * var(--vw)), 54px, calc(11 * var(--vh))); pointer-events: auto; }
    #nav button.active {
      background: linear-gradient(180deg, #ffe680 0%, #ffc93a 100%);
      box-shadow: 0 4px 0 #e0a21c, 0 0 0 4px rgba(255,214,90,.45), 0 6px 14px rgba(160,100,10,.25);
      animation: navPop .45s cubic-bezier(.34,1.56,.64,1);
    }
    #nav button.active:active { transform: translateY(3px) scale(.92); }
    @keyframes navPop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: none; } }
    /* pedido em outro cômodo: o botão daquele cômodo chama com um pulso suave */
    #nav button.wish { animation: wish 1.3s ease-in-out infinite; box-shadow: 0 4px 0 #cdb8f0, 0 0 0 5px rgba(255,214,90,.7), 0 0 18px 6px rgba(255,214,90,.55); }
    @keyframes wish { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14) rotate(-4deg); } }
    /* adesivo chegou: o botão do álbum dá um pulinho */
    #btnAlbum.bump { animation: bump .6s cubic-bezier(.34,1.56,.64,1); }
    @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3); } 100% { transform: scale(1); } }

    .corner { position: fixed; z-index: 6; }
    #btnSound { top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; }
    #btnAlbum { top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(12px + min(calc(12 * var(--vw)), 54px) * 1 + 10px); }
    #btnShop { top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(12px + min(calc(12 * var(--vw)), 54px) * 2 + 20px); }
    #btnMissions { top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(12px + min(calc(12 * var(--vw)), 54px) * 3 + 30px); }
    #btnBack { top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; }
    #btnHome { top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(12px + min(calc(12 * var(--vw)), 54px) * 1 + 10px); }
    #btnPets { top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(12px + min(calc(12 * var(--vw)), 54px) * 2 + 20px); }
    #btnParent { top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(12px + min(calc(12 * var(--vw)), 54px) * 3 + 30px); }
    #btnBack { background: linear-gradient(180deg, #fff7c2 0%, #ffe680 100%); box-shadow: 0 4px 0 #e0a21c, 0 6px 14px rgba(160,100,10,.2); transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s; }
    #btnBack.off { opacity: 0; transform: scale(.4); pointer-events: none; }
    #btnBack.hey { animation: bump .6s cubic-bezier(.34,1.56,.64,1); }
    #btnShop.ready::before, #btnMissions.ready::before {
      content: ""; position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; border-radius: 50%;
      background: #ff4f7a; border: 3px solid #fff; animation: dotPulse 1.2s ease-in-out infinite;
    }
    #btnShop.ready { animation: wish 1.6s ease-in-out infinite; }
    @keyframes dotPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    #btnShop.wish, #btnHome.wish { animation: wish 1.3s ease-in-out infinite; box-shadow: 0 4px 0 #cdb8f0, 0 0 0 5px rgba(255,214,90,.7), 0 0 18px 6px rgba(255,214,90,.55); }

    /* Contador de estrelinhas + coração de carinho (topo, centro) */
    #starPill {
      position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 8px; border: none; cursor: pointer;
      border-radius: 999px; background: linear-gradient(180deg, #ffffff 0%, #fff4c9 100%);
      box-shadow: 0 4px 0 #e6c86a, 0 6px 14px rgba(160,100,10,.18); font: inherit; color: #6b4a14;
    }
    #starPill.bump { animation: pillBump .45s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pillBump { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.18); } 100% { transform: translateX(-50%) scale(1); } }
    #starCount { font-size: 22px; font-weight: bold; min-width: 1.6em; text-align: left; }
    #loveMeter { position: relative; width: 30px; height: 28px; margin-left: 4px; }
    #loveMeter svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #loveFillBox { position: absolute; inset: 0; clip-path: path("M15 26 C3 18 0 11 4 6 C8 1 13 3 15 7 C17 3 22 1 26 6 C30 11 27 18 15 26 Z"); }
    #loveFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(180deg, #ff9cc0, #ff4f7a); transition: height .5s cubic-bezier(.34,1.56,.64,1); }
    #loveLvl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: bold; color: #a8325c; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; padding-bottom: 3px; }
    #loveMeter.bump { animation: bump .7s cubic-bezier(.34,1.56,.64,1); }
    .flyStar { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; will-change: transform; }

    /* Lojinha de prêmios */
    #shop .panel, #missions .panel { width: min(calc(90 * var(--vw)), 820px); }
    #shopGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; margin-top: calc(2 * var(--vh)); }
    .prize { position: relative; border: 3px solid #f0e2c0; border-radius: 22px; background: #fffaf0; padding: 8px 6px 10px; cursor: pointer; font: inherit; color: #6b4a14; transition: transform .15s; }
    .overlay.show .prize { animation: cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards; }
    .prize:active { transform: scale(.92); }
    .prize.locked .prizeIco { filter: grayscale(.85) opacity(.55); }
    .prize.ready { border-color: #ffc93a; background: #fff3c4; box-shadow: 0 0 0 4px rgba(255,214,90,.45), 0 0 18px rgba(255,200,60,.6); }
    .overlay.show .prize.ready { animation: cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards, wish 1.4s ease-in-out .5s infinite; }
    .prize.owned { border-color: #bfe8c6; background: #f1fff3; }
    .prize.nope { animation: nope .35s ease; }
    @keyframes nope { 25% { transform: translateX(-4px) rotate(-3deg); } 75% { transform: translateX(4px) rotate(3deg); } }
    .prizeIco { display: grid; place-items: center; height: 66px; }
    .prizePrice { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 18px; font-weight: bold; margin-top: 4px; }
    .prizeBar { height: 8px; border-radius: 99px; background: #f0e2c0; margin: 6px 6px 0; overflow: hidden; }
    .prizeBar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd54a, #ffb300); border-radius: 99px; }
    .ok { color: #2fa84f; font-size: 24px; }

    /* Missões do dia */
    #missionList { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: calc(2 * var(--vh)); }
    .mission { border: 3px solid #e3d6fb; border-radius: 24px; background: #faf6ff; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; color: #4a3f5c; transition: transform .15s; }
    .overlay.show .mission { animation: cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards; }
    .mission:active { transform: scale(.92); }
    .mission.done { border-color: #bfe8c6; background: #f1fff3; }
    .missionState { display: flex; align-items: center; gap: 4px; font-size: 18px; font-weight: bold; color: #b8860b; }
    #btnPets.wish { animation: wish 1.3s ease-in-out infinite; box-shadow: 0 4px 0 #cdb8f0, 0 0 0 5px rgba(255,214,90,.7), 0 0 18px 6px rgba(255,214,90,.55); }
    #petsGrid { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: calc(2 * var(--vh)); }
    .petCard { border: 3px solid #e3d6fb; border-radius: 26px; background: #faf6ff; padding: 8px 10px; cursor: pointer; font: inherit; color: #4a3f5c; transition: transform .15s; }
    .petCard:active { transform: scale(.92); }
    .petCard.active { border-color: #ffc93a; background: #fff7d6; }
    .overlay.show .petCard { animation: cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards; }
    .petName { font-size: 18px; margin-top: 2px; }
    .corner button { position: fixed; width: min(calc(12 * var(--vw)), 54px); height: min(calc(12 * var(--vw)), 54px); }
    #btnSound .slash { opacity: 0; transition: opacity .2s; }
    #btnSound.off .slash { opacity: 1; }
    #btnSound.off .waves { opacity: .2; }
    #btnSound .waves { transition: opacity .2s; }
    /* anel de progresso ao segurar o botão dos responsáveis */
    #btnParent::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 4px solid transparent; border-top-color: #8a3bff; opacity: 0;
    }
    #btnParent:active::after { opacity: 1; animation: hold 1.2s linear forwards; }
    @keyframes hold { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    /* Overlays: entram com fade + escala elástica (antes: display none/flex) */
    .overlay {
      position: fixed; inset: 0; z-index: 20; display: flex;
      align-items: center; justify-content: center; padding: calc(5 * var(--vw));
      background: rgba(40,30,60,.45); backdrop-filter: blur(3px);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .25s ease, visibility 0s linear .25s;
    }
    .overlay.show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .25s ease; }
    .panel {
      background: #fff; color: #4a3f5c; border-radius: 28px; padding: calc(4 * var(--vh)) calc(5 * var(--vw));
      max-width: calc(92 * var(--vw)); max-height: calc(86 * var(--vh)); overflow: auto;
      box-shadow: 0 6px 0 #e3d6fb, 0 18px 50px rgba(40,20,70,.35);
      transform: translateY(18px) scale(.9);
      transition: transform .38s cubic-bezier(.34,1.56,.64,1);
    }
    .overlay.show .panel { transform: none; }
    .panel h2 { font-size: min(calc(6 * var(--vw)), 28px); margin-bottom: calc(2 * var(--vh)); }
    .panel .close {
      float: right; border: none; background: #ff8bbf; color: #fff; font-size: 20px;
      width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
      box-shadow: 0 3px 0 #e0679f; transition: transform .15s;
    }
    .panel .close:active { transform: translateY(2px) scale(.9); }
    #albumGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; margin-top: calc(2 * var(--vh)); }
    .albumCard { text-align: center; opacity: .5; transform: scale(.9); }
    .albumCard.found { opacity: 1; transform: none; }
    .overlay.show .albumCard.found { animation: cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards; }
    .overlay.show .albumCard:nth-child(2) { animation-delay: .04s; } .overlay.show .albumCard:nth-child(3) { animation-delay: .08s; }
    .overlay.show .albumCard:nth-child(4) { animation-delay: .12s; } .overlay.show .albumCard:nth-child(5) { animation-delay: .16s; }
    .overlay.show .albumCard:nth-child(6) { animation-delay: .2s; } .overlay.show .albumCard:nth-child(n+7) { animation-delay: .24s; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.7); } }
    .albumIcon { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 6px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); display: grid; place-items: center; font-size: 30px; color: #b3a6c9; }
    .albumTitle { font-size: 15px; min-height: 1.2em; }
    button.albumCard { border: none; background: none; font: inherit; color: inherit; cursor: pointer; transition: transform .15s; }
    button.albumCard:active { transform: scale(.9); }
    #albumStickers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; margin-top: calc(1 * var(--vh)); background: #faf6ff; border-radius: 20px; }
    .sticker { border: none; background: none; padding: 0; cursor: pointer; transition: transform .15s; }
    .sticker:active { transform: scale(.88) rotate(-6deg); }
    .overlay.show .sticker { animation: cardIn .5s cubic-bezier(.34,1.56,.64,1) backwards; }

    .modeRow { display: flex; gap: 10px; flex-wrap: wrap; margin: calc(2 * var(--vh)) 0; }
    .modeRow button {
      flex: 1 1 30%; padding: 14px; border: 2px solid #d9c7f5; border-radius: 14px;
      background: #faf6ff; font-size: 16px; cursor: pointer; transition: background .2s, color .2s, transform .15s;
    }
    .modeRow button:active { transform: scale(.95); }
    .modeRow button.active { background: #8a3bff; color: #fff; border-color: #8a3bff; }
    .cfg { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 17px; }
    .cfg input { width: 26px; height: 26px; accent-color: #8a3bff; }
    .hint { font-size: 13px; color: #8a7fa0; margin-top: calc(1 * var(--vh)); }

    /* Palco: sempre paisagem. Em retrato no navegador, body.rot gira o palco
       90° (o Viewport troca os eixos). --vw/--vh são 1% da largura/altura do
       PALCO, então os tamanhos abaixo valem nas duas situações. */
    :root { --vw: 1vw; --vh: 1vh; }
    body.rot { --vw: 1vh; --vh: 1vw; }
    #stage { position: fixed; inset: 0; overflow: hidden; }
    body.rot #stage {
      inset: auto; top: 0; left: 100vw; width: 100vh; height: 100vw;
      transform: rotate(90deg); transform-origin: top left;
    }

    /* ---------- Tela inicial (Play) ---------- */
    #title {
      position: absolute; inset: 0; z-index: 40; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: calc(4 * var(--vw));
      background: linear-gradient(180deg, #ffe2b0 0%, #f6dcff 55%, #cbb6f5 100%);
      transition: opacity .5s ease, transform .5s cubic-bezier(.5,0,.75,0);
    }
    #title.out { opacity: 0; transform: scale(1.15); pointer-events: none; }
    #title .tLeft { display: flex; flex-direction: column; align-items: center; gap: calc(5 * var(--vh)); z-index: 2; }
    #title .logo { display: flex; flex-direction: column; align-items: center; line-height: .95; font-weight: 900; }
    #title .lt {
      display: inline-block; color: #fff; paint-order: stroke fill;
      -webkit-text-stroke: calc(1.1 * var(--vh)) #3a2f4f;
      font-size: calc(9 * var(--vh)); text-shadow: 0 calc(.8 * var(--vh)) 0 rgba(58,47,79,.35);
      animation: tPop .7s cubic-bezier(.3,1.6,.5,1) both, tWave 2.6s ease-in-out 1s infinite;
    }
    #title .l1 .lt { color: #c6b2ff; }
    #title .lt.big { font-size: calc(21 * var(--vh)); color: #ffc062; -webkit-text-stroke-width: calc(1.6 * var(--vh)); }
    #title .sp { display: inline-block; width: calc(3 * var(--vh)); }
    @keyframes tPop { from { transform: translateY(calc(-30 * var(--vh))) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes tWave { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(calc(-2.4 * var(--vh))) rotate(-4deg); } 90% { transform: translateY(calc(.6 * var(--vh))); } }
    #btnPlay {
      position: relative; width: calc(24 * var(--vh)); height: calc(24 * var(--vh)); border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9ff08a, #4cc65a 60%, #2f9a45);
      border: calc(1.1 * var(--vh)) solid #3a2f4f; box-shadow: 0 calc(1.4 * var(--vh)) 0 #2a6f36, 0 calc(2.4 * var(--vh)) calc(3 * var(--vh)) rgba(58,47,79,.3);
      animation: tPop .6s .55s cubic-bezier(.3,1.6,.5,1) both, tBeat 1.4s 1.3s ease-in-out infinite;
      cursor: pointer;
    }
    #btnPlay svg { width: 62%; height: 62%; margin-left: 8%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
    #btnPlay:active { transform: translateY(calc(1 * var(--vh))) scale(.94); box-shadow: 0 calc(.4 * var(--vh)) 0 #2a6f36; }
    #btnPlay .ring { position: absolute; inset: -10%; border-radius: 50%; border: calc(.8 * var(--vh)) solid #fff; opacity: 0; animation: tRing 1.8s 1.3s ease-out infinite; pointer-events: none; }
    #btnPlay .ring.r2 { animation-delay: 2.2s; }
    @keyframes tBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes tRing { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
    #title .tRight { position: relative; width: calc(58 * var(--vh)); height: calc(58 * var(--vh)); z-index: 2; }
    #title .tNubi {
      position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 90%;
      animation: tDrop .9s .2s cubic-bezier(.3,1.5,.5,1) both, tBounce 2.2s 1.1s ease-in-out infinite;
    }
    #title .tNubi.boing { animation: tBoing .55s cubic-bezier(.3,1.6,.5,1); }
    #title .tShadow { position: absolute; left: 22%; right: 22%; bottom: 2%; height: 6%; border-radius: 50%; background: rgba(90,60,150,.25); animation: tShadow 2.2s 1.1s ease-in-out infinite; }
    @keyframes tDrop { from { transform: translateY(-120%) scale(.6); } to { transform: none; } }
    @keyframes tBounce { 0%, 100% { transform: none; } 15% { transform: scale(1.06, .94); } 45% { transform: translateY(-7%) scale(.97, 1.04); } 70% { transform: scale(1.03, .97); } }
    @keyframes tShadow { 0%, 100% { transform: none; } 45% { transform: scale(.82); opacity: .7; } }
    @keyframes tBoing { 0% { transform: scale(1.15, .8); } 40% { transform: translateY(-14%) scale(.9, 1.12); } 100% { transform: none; } }
    #title.go .tNubi { animation: tJump .6s cubic-bezier(.3,1.4,.5,1) both; }
    #title.go .logo { transition: transform .5s cubic-bezier(.5,-.4,.7,1); transform: translateY(calc(-60 * var(--vh))); }
    #title.go #btnPlay { animation: none; transform: scale(1.25); opacity: 0; transition: transform .35s ease, opacity .35s ease; }
    @keyframes tJump { 0% { transform: scale(1.2, .8); } 45% { transform: translateY(-30%) scale(.88, 1.14) rotate(-6deg); } 100% { transform: translateY(-12%) scale(1.05); } }
    #title .tCloud { position: absolute; background: #fffaf3; border-radius: 999px; opacity: .85; z-index: 1;
      box-shadow: calc(4 * var(--vh)) calc(-3 * var(--vh)) 0 calc(1 * var(--vh)) #fffaf3, calc(-4 * var(--vh)) calc(-1.5 * var(--vh)) 0 0 #fffaf3; }
    #title .c1 { width: calc(18 * var(--vh)); height: calc(7 * var(--vh)); top: 14%; animation: tDrift 38s linear -6s infinite; }
    #title .c2 { width: calc(26 * var(--vh)); height: calc(9 * var(--vh)); top: 68%; animation: tDrift 52s linear -30s infinite; opacity: .7; }
    #title .c3 { width: calc(14 * var(--vh)); height: calc(6 * var(--vh)); top: 38%; animation: tDrift 44s linear -18s infinite; opacity: .6; }
    @keyframes tDrift { from { left: -30%; } to { left: 110%; } }
    #title .tw { position: absolute; color: #ffd36e; font-size: calc(5 * var(--vh)); text-shadow: 0 0 calc(2 * var(--vh)) #fff; z-index: 1; animation: tTwinkle 2.4s ease-in-out infinite; }
    #title .t1 { left: 8%; top: 12%; } #title .t2 { left: 46%; top: 8%; animation-delay: .6s; font-size: calc(3.5 * var(--vh)); }
    #title .t3 { right: 7%; top: 18%; animation-delay: 1.1s; color: #fff; } #title .t4 { right: 12%; bottom: 14%; animation-delay: 1.7s; }
    #title .t5 { left: 14%; bottom: 18%; animation-delay: .3s; color: #fff; }
    @keyframes tTwinkle { 0%, 100% { transform: scale(.7) rotate(0); opacity: .5; } 50% { transform: scale(1.15) rotate(20deg); opacity: 1; } }
    body.reduce-motion #title * { animation-iteration-count: 1 !important; }

    body.reduce-motion *, body.reduce-motion *::after { animation-duration: .01s !important; transition-duration: .05s !important; }
    @media (prefers-reduced-motion: reduce) { #nav button.active { animation: none; } }
  </style>
</head>
<body>
  <div id="stage">
  <canvas id="game"></canvas>

  <nav id="nav">
    <button class="toy" data-room="hub" aria-label="Mapa da casa">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M6 23L24 8l18 15" fill="#ff8a7a" stroke="#a8322c" stroke-width="3" stroke-linejoin="round"/>
        <rect x="11" y="21" width="26" height="20" rx="3" fill="#fff4e2" stroke="#c9a37a" stroke-width="3"/>
        <rect x="20" y="29" width="8" height="12" rx="2" fill="#ffd54a" stroke="#a8791a" stroke-width="2.5"/>
        <rect x="14" y="25" width="5" height="5" rx="1" fill="#bfe6ff"/><rect x="29" y="25" width="5" height="5" rx="1" fill="#bfe6ff"/>
      </svg>
    </button>
    <button class="toy" data-room="kitchen" aria-label="Cozinha">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <ellipse cx="24" cy="30" rx="18" ry="9" fill="#fff" stroke="#c98a52" stroke-width="3"/>
        <circle cx="17" cy="24" r="6" fill="#4a74d6" stroke="#2d4a8f" stroke-width="2.5"/>
        <path d="M27 27c-6-5-3-11 2-9 5-2 8 4 2 9z" fill="#e8426b" stroke="#9c1f3f" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M33 20c3 0 6 3 6 6" fill="none" stroke="#f6cf3f" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="toy" data-room="bathroom" aria-label="Banheiro">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="16" cy="13" r="4" fill="#bfe6ff" stroke="#4c7ea6" stroke-width="2"/>
        <circle cx="26" cy="9" r="3" fill="#bfe6ff" stroke="#4c7ea6" stroke-width="2"/>
        <path d="M5 24h38v4a12 12 0 0 1-12 12H17A12 12 0 0 1 5 28z" fill="#fff" stroke="#4c7ea6" stroke-width="3" stroke-linejoin="round"/>
        <path d="M8 24h32" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
        <circle cx="35" cy="19" r="4" fill="#ffe14d" stroke="#b8860b" stroke-width="2"/>
      </svg>
    </button>
    <button class="toy" data-room="bedroom" aria-label="Quarto">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect x="5" y="14" width="6" height="26" rx="3" fill="#b98ee6" stroke="#6e4aa3" stroke-width="2.5"/>
        <rect x="9" y="25" width="34" height="11" rx="5" fill="#8fd3ff" stroke="#3c7fb0" stroke-width="2.5"/>
        <rect x="12" y="20" width="11" height="8" rx="4" fill="#fff1a8" stroke="#c49a1a" stroke-width="2"/>
        <path d="M9 36v4M41 36v4" stroke="#6e4aa3" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="toy" data-room="dentist" aria-label="Consultório dos dentinhos">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M12 12c-4 2-4 9-2 15 1.5 5 2 12 5 12 2.5 0 2.5-8 5-8h8c2.5 0 2.5 8 5 8 3 0 3.5-7 5-12 2-6 2-13-2-15-4-2-7 1-12 1s-8-3-12-1z" fill="#fff" stroke="#7fa3b8" stroke-width="3" stroke-linejoin="round"/>
        <path d="M37 9l1.4 3 3.2.4-2.3 2.2.6 3.2-2.9-1.6-2.9 1.6.6-3.2-2.3-2.2 3.2-.4z" fill="#ffd54a"/>
      </svg>
    </button>
    <button class="toy" data-room="salon" aria-label="Salão de beleza">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="16" cy="14" r="6" fill="#f6cf3f" stroke="#a8791a" stroke-width="2.5"/>
        <circle cx="25" cy="10" r="6" fill="#f6cf3f" stroke="#a8791a" stroke-width="2.5"/>
        <circle cx="33" cy="15" r="6" fill="#f6cf3f" stroke="#a8791a" stroke-width="2.5"/>
        <rect x="16" y="24" width="10" height="16" rx="4" fill="#ff6bb5" stroke="#a8325c" stroke-width="2.5"/>
        <rect x="18" y="18" width="6" height="7" rx="2" fill="#3a2f4f"/>
        <path d="M30 34c2-4 8-4 10 0-2 3-8 3-10 0z" fill="#e8426b" stroke="#8a1f3a" stroke-width="2"/>
      </svg>
    </button>
  </nav>

  <div class="corner"><button class="toy" id="btnBack" aria-label="Voltar">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M36 24H13M23 13L12 24l11 11" fill="none" stroke="#8a5a0a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button></div>
  <div class="corner"><button class="toy" id="btnHome" aria-label="Mapa da casa">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M6 23L24 8l18 15" fill="#ff8a7a" stroke="#a8322c" stroke-width="3" stroke-linejoin="round"/>
      <rect x="11" y="21" width="26" height="20" rx="3" fill="#fff4e2" stroke="#c9a37a" stroke-width="3"/>
      <rect x="20" y="29" width="8" height="12" rx="2" fill="#ffd54a" stroke="#a8791a" stroke-width="2.5"/>
    </svg>
  </button></div>
  <div class="corner"><button class="toy" id="btnShop" aria-label="Lojinha de prêmios">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="8" y="20" width="32" height="20" rx="4" fill="#fff7d6" stroke="#e0a21c" stroke-width="3"/>
      <path d="M5 20l4-11h30l4 11z" fill="#ff6b9d" stroke="#a8325c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M15 10v9M24 10v9M33 10v9" stroke="#fff" stroke-width="4"/>
      <path d="M24 23l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#ffd54a" stroke="#b8860b" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </button></div>
  <div class="corner"><button class="toy" id="btnMissions" aria-label="Missões do dia">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect x="11" y="8" width="26" height="34" rx="4" fill="#fff" stroke="#7fa3b8" stroke-width="3"/>
      <rect x="18" y="5" width="12" height="6" rx="2" fill="#ffd54a" stroke="#a8791a" stroke-width="2"/>
      <path d="M16 19l3 3 5-6M16 30l3 3 5-6" fill="none" stroke="#62c370" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="27" y="18" width="6" height="4" rx="2" fill="#e3d6fb"/><rect x="27" y="29" width="6" height="4" rx="2" fill="#e3d6fb"/>
    </svg>
  </button></div>

  <button id="starPill" aria-label="Estrelinhas">
    <span id="starIco"></span><span id="starCount">0</span>
    <span id="loveMeter" aria-label="Carinho do bichinho">
      <span id="loveFillBox"><span id="loveFill"></span></span>
      <svg viewBox="0 0 30 28" aria-hidden="true"><path d="M15 26 C3 18 0 11 4 6 C8 1 13 3 15 7 C17 3 22 1 26 6 C30 11 27 18 15 26 Z" fill="none" stroke="#a8325c" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span id="loveLvl">1</span>
    </span>
  </button>

  <!-- Lojinha -->
  <div class="overlay" id="shop">
    <div class="panel">
      <button class="close" id="shopClose" aria-label="Fechar">✕</button>
      <h2>Prêmios das estrelinhas</h2>
      <div id="shopGrid"></div>
    </div>
  </div>

  <!-- Missões do dia -->
  <div class="overlay" id="missions">
    <div class="panel">
      <button class="close" id="missionsClose" aria-label="Fechar">✕</button>
      <h2>Missões de hoje</h2>
      <div id="missionList"></div>
    </div>
  </div>

  <div class="corner"><button class="toy" id="btnSound" aria-label="Som">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M8 19h7l10-8v26l-10-8H8z" fill="#ffd54a" stroke="#a8791a" stroke-width="3" stroke-linejoin="round"/>
      <g class="waves" fill="none" stroke="#8a3bff" stroke-width="3.5" stroke-linecap="round">
        <path d="M31 18a8 8 0 0 1 0 12"/><path d="M36 13a15 15 0 0 1 0 22"/>
      </g>
      <path class="slash" d="M30 16l12 16" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </button></div>
  <div class="corner"><button class="toy" id="btnAlbum" aria-label="Álbum de descobertas">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M6 11c7-3 13-2 18 2v26c-5-4-11-5-18-2z" fill="#ff9bc4" stroke="#b3406f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M42 11c-7-3-13-2-18 2v26c5-4 11-5 18-2z" fill="#9fd3ff" stroke="#3c7fb0" stroke-width="3" stroke-linejoin="round"/>
      <path d="M33 19l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#ffd54a"/>
    </svg>
  </button></div>
  <div class="corner"><button class="toy" id="btnPets" aria-label="Escolher bichinho">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <ellipse cx="17" cy="9" rx="4" ry="9" fill="#ffe3ee" stroke="#c7709a" stroke-width="2.5"/>
      <ellipse cx="27" cy="9" rx="4" ry="9" fill="#ffe3ee" stroke="#c7709a" stroke-width="2.5"/>
      <circle cx="22" cy="27" r="13" fill="#ffe3ee" stroke="#c7709a" stroke-width="3"/>
      <circle cx="17" cy="25" r="2.2" fill="#3a2f4f"/><circle cx="27" cy="25" r="2.2" fill="#3a2f4f"/>
      <path d="M20 31l2 2 2-2" fill="none" stroke="#3a2f4f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="38" cy="34" r="7" fill="#d9a273" stroke="#7a4a1f" stroke-width="2.5"/>
      <circle cx="33.5" cy="28.5" r="2.6" fill="#d9a273" stroke="#7a4a1f" stroke-width="2"/><circle cx="42.5" cy="28.5" r="2.6" fill="#d9a273" stroke="#7a4a1f" stroke-width="2"/>
    </svg>
  </button></div>
  <div class="corner"><button class="toy" id="btnParent" aria-label="Área dos responsáveis (segure)">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 6l4 4h6v6l4 4-4 4v6h-6l-4 4-4-4h-6v-6l-4-4 4-4v-6h6z" fill="#cdb8f0" stroke="#6e4aa3" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="6" fill="#fff" stroke="#6e4aa3" stroke-width="3"/>
    </svg>
  </button></div>

  <!-- Álbum -->
  <div class="overlay" id="album">
    <div class="panel">
      <button class="close" id="albumClose" aria-label="Fechar">✕</button>
      <h2>Descobertas do Nubi</h2>
      <div id="albumStickers"></div>
      <div id="albumGrid"></div>
    </div>
  </div>

  <!-- Vitrine de bichinhos -->
  <div class="overlay" id="pets">
    <div class="panel">
      <button class="close" id="petsClose" aria-label="Fechar">✕</button>
      <h2>Com quem vamos brincar?</h2>
      <div id="petsGrid"></div>
    </div>
  </div>

  <!-- Área dos responsáveis -->
  <div class="overlay" id="parent">
    <div class="panel">
      <button class="close" id="parentClose" aria-label="Fechar">✕</button>
      <h2>Para os responsáveis</h2>
      <p>Modo de brincadeira:</p>
      <div class="modeRow">
        <button data-mode="explore">Explorar</button>
        <button data-mode="experiment">Experimentar</button>
        <button data-mode="solve">Resolver</button>
      </div>
      <label class="cfg"><input type="checkbox" id="cfgMusic" /> Música</label>
      <label class="cfg"><input type="checkbox" id="cfgSfx" /> Efeitos sonoros</label>
      <label class="cfg"><input type="checkbox" id="cfgVoice" /> Falas do Nubi</label>
      <label class="cfg"><input type="checkbox" id="cfgReduce" /> Reduzir movimento e partículas</label>
      <p class="hint">Esta área reduz toques acidentais; não é comprovação de idade. Sem anúncios, compras, contas ou coleta de dados.</p>
    </div>
  </div>

  </div><!-- /#stage -->

  <script type="module">
    import { boot } from "./src/main.js";
    boot();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
